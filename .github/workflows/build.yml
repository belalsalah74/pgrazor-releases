name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name/KEYSTORE_BASE64/RELEASE_KEYSTORE_BASE64}"
              case "$name" in
                STORE_PASSWORD) echo "::error::Add secret RELEASE_STORE_PASSWORD" ;;
                KEY_ALIAS) echo "::error::Add secret RELEASE_KEY_ALIAS" ;;
                KEY_PASSWORD) echo "::error::Add secret RELEASE_KEY_PASSWORD" ;;
              esac
              exit 1
            fi
          done
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgrazor-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pgrazor-signing/release.jks"
          test -s "$RUNNER_TEMP/pgrazor-signing/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/pgrazor-signing/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/pgrazor-signing/release.jks" >> "$GITHUB_ENV"
      - name: Build pinned APKEditor engine
        run: |
          git clone https://github.com/REAndroid/APKEditor.git "$RUNNER_TEMP/APKEditor"
          cd "$RUNNER_TEMP/APKEditor"
          git checkout 5d94bc08565e30e3e3bb7accbd83138e4d6a8e45
          sed -i 's/compile(files(/implementation(files(/g; s/configurations.compile.collect/configurations.runtimeClasspath.collect/g' build.gradle
          gradle --no-daemon fatJar
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          JAR="$(find build/libs -maxdepth 1 -type f -name 'APKEditor-*.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/app/libs/APKEditor.jar"
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease --stacktrace
      - name: Verify and stage release APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="app/build/outputs/apk/release/app-release.apk"
          RELEASE_APK="app/build/outputs/apk/release/PGRazor.apk"
          test -s "$SOURCE"
          cp "$SOURCE" "$RELEASE_APK"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"
          ENTRIES="$(unzip -Z1 "$RELEASE_APK")"
          grep -Fxq 'AndroidManifest.xml' <<< "$ENTRIES"
          grep -Eq '^classes([0-9]+)?[.]dex$' <<< "$ENTRIES"
          sha256sum "$RELEASE_APK"
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: PGRazor Updater v0.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/PGRazor.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
      - name: Add direct APK link to workflow summary
        shell: bash
        run: |
          echo "## PGRazor Updater APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download APK](https://github.com/${{ github.repository }}/releases/download/v0.0.${{ github.run_number }}/PGRazor.apk)" >> "$GITHUB_STEP_SUMMARY"
