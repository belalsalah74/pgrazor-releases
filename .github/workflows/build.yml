name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted runner already contains Android command-line tools. Do not
      # use android-actions/setup-android@v3 here: it attempts to install the
      # retired SDK package "tools".
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build pinned APKEditor engine
        run: |
          git clone https://github.com/REAndroid/APKEditor.git "$RUNNER_TEMP/APKEditor"
          cd "$RUNNER_TEMP/APKEditor"
          git checkout 5d94bc08565e30e3e3bb7accbd83138e4d6a8e45
          sed -i 's/compile(files(/implementation(files(/g; s/configurations.compile.collect/configurations.runtimeClasspath.collect/g' build.gradle
          gradle --no-daemon fatJar
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          JAR="$(find build/libs -maxdepth 1 -type f -name 'APKEditor-*.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/app/libs/APKEditor.jar"
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PGRazor-Updater-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
