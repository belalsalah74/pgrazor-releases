name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
env:
  APKEDITOR_VERSION: '1.4.9'
  APKEDITOR_SHA256: a9cd40df818845456be6d696de6110c89edf4b0a0580cb83438ed6b25a366e67
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted runner already contains Android command-line tools. Do not
      # use android-actions/setup-android@v3 here: it attempts to install the
      # retired SDK package "tools".
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # The official release jar is checksum-pinned. This replaces cloning APKEditor
      # at a commit and patching its build.gradle with sed, which breaks whenever
      # that build script changes.
      - name: Fetch pinned APKEditor release
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fsSL -o app/libs/APKEditor.jar \
            "https://github.com/REAndroid/APKEditor/releases/download/V${APKEDITOR_VERSION}/APKEditor-${APKEDITOR_VERSION}.jar"
          echo "${APKEDITOR_SHA256}  app/libs/APKEditor.jar" | sha256sum -c -
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          # sdkmanager exits as soon as all licenses are accepted. With
          # pipefail enabled, the expected SIGPIPE from yes fails this step;
          # keep the sdkmanager exit code while ignoring only that pipe status.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      # A debug key is regenerated on every runner, so APKs built with it can never update
      # each other in place. Add these repository secrets for a stable release key:
      # SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret set. Falling back to the per-runner debug key; installs will not update in place across builds."
          fi
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "PGRazor-Updater-v0.0.${{ github.run_number }}.apk"
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: PGRazor Updater v0.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: PGRazor-Updater-v0.0.${{ github.run_number }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
      - name: Add direct APK link to workflow summary
        shell: bash
        run: |
          echo "## PGRazor Updater APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download APK](https://github.com/${{ github.repository }}/releases/download/v0.0.${{ github.run_number }}/PGRazor-Updater-v0.0.${{ github.run_number }}.apk)" >> "$GITHUB_STEP_SUMMARY"
