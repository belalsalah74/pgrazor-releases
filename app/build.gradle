plugins { id 'com.android.application' }

android {
    namespace 'dev.pgrazor.updater'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.pgrazor.updater'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha1'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('RELEASE_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('RELEASE_STORE_PASSWORD')
            def keyAliasValue = System.getenv('RELEASE_KEY_ALIAS')
            def keyPasswordValue = System.getenv('RELEASE_KEY_PASSWORD')
            if (keystorePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation files('libs/APKEditor.jar')
    implementation 'com.android.tools.build:apksig:8.7.3'
    implementation 'androidx.core:core:1.15.0'
}
