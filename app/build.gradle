plugins { id 'com.android.application' }

android {
    namespace 'dev.pgrazor.updater'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.pgrazor.updater'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha1'
    }
}

dependencies {
    implementation files('libs/APKEditor.jar')
    implementation 'com.android.tools.build:apksig:8.7.3'
    implementation 'androidx.core:core:1.15.0'
}
